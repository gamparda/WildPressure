# WildPressure 0.2.0 - Paper 26.2 build 87
population:
  target-per-player: 5000
  region-size-chunks: 8
  influence-radius-chunks: 10
  reconcile-period-ticks: 20
  max-spawns-per-pass: 50
  max-removals-per-pass: 20
  max-index-refresh-per-pass: 250
  irrelevant-grace-seconds: 120
  pause-spawning-above-mspt: 45.0
  adopt-existing-on-enable: true

natural-spawn-control:
  enabled: true
  blocked-reasons:
    - NATURAL
    - CHUNK_GEN

spawn:
  min-distance-from-player: 32
  max-location-attempts: 12
  max-block-light: 15
  keep-managed-mobs-from-vanilla-despawn: true
  # 중복 항목은 가중치로 사용된다.
  species:
    - ZOMBIE
    - ZOMBIE
    - ZOMBIE
    - SKELETON
    - SKELETON
    - SPIDER
    - CREEPER

depletion:
  deaths-to-deplete: 25
  death-window-seconds: 120
  refill-cooldown-seconds: 300

pressure:
  maximum: 100.0
  decay-per-second: 0.15
  operation-threshold: 30.0
  operation-cost: 20.0
  block-break: 1.2
  block-place: 0.4
  door: 0.5
  explosion: 25.0
  player-damage-multiplier: 0.8
  combat-hit: 1.5
  sprint-per-sample: 0.6
  corpse: 2.5
  # 플레이어 위치의 광원을 저빈도로 표본 조사한다.
  light-threshold: 11
  light-per-sample: 1.0
  light-sample-every-passes: 5

lure:
  material: ECHO_SHARD
  pressure: 60.0

ai:
  period-ticks: 20
  max-active-operations: 3
  max-group-size: 80
  recruitment-region-radius: 1
  max-path-requests-per-operation-pass: 20
  region-operation-cooldown-seconds: 180
  scout-timeout-seconds: 60
  scout-arrival-distance: 12.0
  mobilize-seconds: 8
  assault-duration-seconds: 180
  retreat-seconds: 10
  retreat-alive-fraction: 0.25
  move-speed: 1.1
  player-acquisition-radius: 48.0

  # 구조물 파괴는 기본 비활성화다. 켜도 아래 목록만 파괴한다.
  siege:
    enabled: false
    hits-required: 8
    progress-reset-seconds: 60
    only-near-target-radius: 12.0
    allowed-materials:
      - OAK_DOOR
      - SPRUCE_DOOR
      - BIRCH_DOOR
      - OAK_FENCE
      - SPRUCE_FENCE

  # 작전에 편입된 몹을 죽인 플레이어에게 종료 시 직접 정산한다.
  rewards:
    experience-per-operation-kill: 2
    material: IRON_NUGGET
    one-item-per-kills: 10

messages:
  prefix: '&2[WildPressure]&r '
