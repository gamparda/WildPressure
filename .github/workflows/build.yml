name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: WildPressure
          path: target/WildPressure-*.jar
